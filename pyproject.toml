[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcroscopy"
version = "0.1.0"
description = "Config-driven microscopy ML training, evaluation, and analysis tools."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
  { name = "Divya Sharma" },
]
dependencies = [
  "accelerate==1.13.0",
  "click==8.1.8",
  "hydra-core==1.3.2",
  "huggingface-hub==0.36.0",
  "matplotlib==3.10.1",
  "numpy==2.1.3",
  "omegaconf==2.3.0",
  "opencv-python==4.11.0.86",
  "optuna==4.4.0",
  "pandas==2.2.3",
  "pillow==11.1.0",
  "pytorch-lightning==2.5.1.post0",
  "scikit-learn==1.6.1",
  "scikit-multilearn==0.2.0",
  "scipy==1.15.2",
  "seaborn==0.13.2",
  "torch==2.6.0",
  "torchmetrics==1.7.2",
  "torchvision==0.21.0",
  "transformers==4.57.1",
  "umap-learn==0.5.7",
  "wandb==0.20.1",
]

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "pytest==8.4.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mlcroscopy*"]
