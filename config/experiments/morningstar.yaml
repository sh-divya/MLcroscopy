# @package _global_

# dino with resnet + expt

defaults:
  - override /model: res
  - override /task: stego
  - override /log: debug

model:
  arch:
    micro_kwargs:
      name: dinov3-vits16-pretrain-lvd1689m
      hidden: 384
      unfrozen_layers: 0
    xrf_kwargs:
      kernel:
        kernel_size: 4
        stride: 2
        padding: 1
      down:
        type: skip
      layers: [8, 16, 8]
      final_dim: 6
    expt_kwargs:
      do: True
      layers: [128, 128, 128, 128, 128]
    merge: flatten


    pred_head_kwargs: [32]