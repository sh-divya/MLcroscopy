# @package _global_

# Classic conv layer arch
# but the pool downsample is
# replaced with a conv(stride=2)

defaults:
  - override /model: classic
  - override /task: scratch
  - override /log: debug

model:
  arch:
    _target_: mlcroscopy.models.archs.ScopyClassic

    micro_kwargs:
      down:
        type: conv
        kernel:
          kernel_size: 2
          stride: 2
          padding: 0
      layers: [8, 16, 32, 16, 8]
      final_dim: 7
    
    xrf_kwargs:
      down:
        type: conv
        kernel:
          kernel_size: 2
          stride: 2
          padding: 0
      layers: [16, 32, 16]
      final_dim: 6
    
    pred_head_kwargs: [512, 128]

optim:
  loss: l2
  folds: 3
  epochs: 30
  batch_size: 8
  num_workers: 1
  batch_norm: False
  droprate: 0
  learning-rate: 0.003
  scheduler:
    name: "ReduceLROnPlateau"
    monitor: "total_val_eth_mae"
  early-stopping: False
  es_patience: 5