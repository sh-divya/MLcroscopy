# @package _global_

# dino with expt input

defaults:
  - override /model: dino
  - override /task: stego
  - override /log: debug

model:
  arch:
    merge: global
    xrf_kwargs:
      kernel:
        kernel_size: 4
        stride: 2
        padding: 1
      down:
        type: skip
      layers: [16, 32, 32]
      final_dim: 6
    
    expt_kwargs:
      do: True
      layers: [256, 256, 256, 256]

    pred_head_kwargs: [512, 128, 64]
  
  optim:
    batch_norm: False
    batch_size: 8
    droprate: 0.0
    early-stopping: True
    epochs: 50
    es_patience: 10
    folds: 3
    learning-rate: 0.003
    loss: l2
