# @package _global_

# Best performing MLP results
# The hidden layers are all the dimension
# the y values are not augmented
# [1024, 1024, 1024]

defaults:
  - override /model: mlp
  - override /task: expt
  - override /log: debug


model:
  arch:
      _target_: mlcroscopy.models.archs.ExptMLP
      hidden_kwargs: [512, 1024, 1024, 512] 
  optim:
      batch_norm: false
      batch_size: 8
      droprate: 0
      early-stopping: true
      epochs: 50
      es_patience: 10
      folds: 3
      learning-rate: 0.007959528835603741
      loss: smoothl1
      num_workers: 1