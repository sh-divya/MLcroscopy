# @package _global_

# dino with resnet

defaults:
  - override /model: res
  - override /task: dino
  - override /log: debug

model:
  arch:
    micro_kwargs:
      name: dinov3-vits16-pretrain-lvd1689m
      hidden: 384
    xrf_kwargs:
      kernel:
        kernel_size: 4
        stride: 2
        padding: 1
      down:
        type: skip
      layers: [8, 16, 8]
      final_dim: 6
    merge: flatten


    pred_head_kwargs: [32]