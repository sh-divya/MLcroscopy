# @package _global_

# dino with expt input

defaults:
  - override /model: dino
  - override /task: stego
  - override /log: debug

model:
  arch:
    merge: global
    xrf_kwargs:
      kernel:
        kernel_size: 4
        stride: 2
        padding: 1
      down:
        type: skip
      layers: [16, 32, 32]
      final_dim: 6
    
    expt_kwargs:
      do: True
      layers: [128, 128, 128, 128, 128]

    pred_head_kwargs: [1024, 512, 256]

  optim:
    loss: l2
    folds: 3
    epochs: 50
    batch_size: 8
    num_workers: 1
    batch_norm: False
    learning-rate: 0.003
    early-stopping: True
    es_patience: 10