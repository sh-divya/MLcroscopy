# @package _global_

# dino with expt input

defaults:
  - override /model: dino
  - override /task: both
  - override /log: debug

model:
  arch:
    xrf_kwargs:
      kernel:
        kernel_size: 4
        stride: 2
        padding: 1
      down:
        type: skip
      layers: [16, 32, 32]
      final_dim: 6
    
    expt_kwargs:
      do: True
      layers: [128, 128, 128, 128, 128]

    pred_head_kwargs: [512]