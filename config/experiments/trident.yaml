# @package _global_

# best spear but with expt args

defaults:
  - override /model: classic
  - override /task: both
  - override /log: debug

model:
  arch:
    _target_: mlcroscopy.models.archs.ScopyClassic

    micro_kwargs:
      kernel:
        kernel_size: 4
        stride: 2
        padding: 1
      down:
        type: skip
      layers: [8, 16, 32, 16, 8]
      final_dim: 7
    
    xrf_kwargs:
      kernel:
        kernel_size: 4
        stride: 2
        padding: 1
      down:
        type: skip
      layers: [16, 32, 32]
      final_dim: 6
    
    expt_kwargs:
      do: True
      layers: [128, 128, 128, 128, 128]

    pred_head_kwargs: [512]