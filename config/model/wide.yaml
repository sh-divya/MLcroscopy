arch:
  pred_head_len: 3
  pred_head_width: 16
  pred_hidden_len: 3
  micro_inp_width: 2
  micro_out_width: 8
  micro_res_n: 3
  xrf_conv_width: 16
  xrf_res_len: 2

optim:
  loss: l2
  folds: 3
  epochs: 80
  batch_size: 16
  num_workers: 1
  batch_norm: True
  drop_rate: 0.0
  learning-rate: 0.003
  scheduler:
    name: "ReduceLROnPlateau"
    monitor: "total_val_mae"
  early-stopping: False
